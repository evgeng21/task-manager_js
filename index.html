<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой план - Task Manager</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Мой план</h1>
      <p>Планируй свои дела и отслеживай прогресс</p>
    </header>

    <main>
      <section>
        <form>
          <h2>Добавление задачи</h2>

          <div class="form-marking">
            <label for="task-name">Название задачи</label>
            <input type="text" id="task-name" required name="task-name" />
          </div>

          <div class="form-marking">
            <label for="task-description">Описание задачи</label>
            <textarea id="task-description" name="task-description"></textarea>
          </div>

          <div class="form-marking">
            <label for="task-category">Категория задачи</label>
            <select id="task-category" name="category">
              <option value="work">Работа</option>
              <option value="study">Обучение</option>
              <option value="personal">Личное</option>
            </select>
          </div>

          <div class="form-marking">
            <fieldset>
              <legend>Приоритет</legend>
              <div class="form-marking-el">
                <label for="low">Низкий</label>
                <input type="radio" id="low" name="priority" value="low" />
              </div>
              <div class="form-marking-el">
                <label for="middle">Средний</label>
                <input
                  type="radio"
                  id="middle"
                  name="priority"
                  value="medium"
                />
              </div>
              <div class="form-marking-el">
                <label for="high">Высокий</label>
                <input type="radio" id="high" name="priority" value="high" />
              </div>
            </fieldset>
          </div>

          <div class="form-marking">
            <label for="task-date">Срок выполнения</label>
            <input type="date" id="task-date" name="due-date" />
          </div>

          <button type="submit">Добавить задачу</button>
        </form>
      </section>

      <section>
        <h2>Мои задачи</h2>

        <button id="add-task">Добавить задачу</button>

        <div class="card-list">
          <div class="task-card">
            <div class="task-card-header">
              <span>Изучить JavaScript</span>
              <input type="checkbox" id="task-card-js-done" />
            </div>

            <div class="task-card-category">
              <p>Обучение</p>
              <p>Приоритет: высокий</p>
            </div>

            <div class="task-card-description">
              <p>Повторить массивы и объекты</p>
            </div>
          </div>

          <div class="task-card">
            <div class="task-card-header">
              <span>Изучить HTML</span>
              <input type="checkbox" />
            </div>

            <div class="task-card-category">
              <p>Обучение</p>
              <p>Приоритет: средний</p>
            </div>

            <div class="task-card-description">
              <p>Изучить основные тэги</p>
            </div>
          </div>
        </div>
      </section>

      <section class="test">

        <h2>Grid test</h2>
        

        <div class="grid-test">
            <div class="grid-test-el">Первый</div>
            <div class="grid-test-el">Второй</div>
            <div class="grid-test-el">Третий</div>
            <div class="grid-test-el">Четвёртый</div>
            <div class="grid-test-el">Пятый</div>
            <div class="grid-test-el">Шестой</div>
        </div>

      </section>

    </main>
  </body>
</html>
