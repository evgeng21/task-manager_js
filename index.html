<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой план - Task Manager</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Мой план</h1>
      <p>Планируй свои дела и отслеживай прогресс</p>
    </header>

    <main>
      <section>
        <form>
          <label for="task_name_input">Название задачи</label>
          <input type="text" id="task_name_input" required name="task-name" />

          <label for="task-description-text">Описание задачи</label>
          <textarea
            id="task-description-text"
            name="task-description"
          ></textarea>

          <label for="task_category_option">Категория задачи</label>
          <select id="task_category_option" name="category">
            <option value="work">Работа</option>
            <option value="study">Обучение</option>
            <option value="personal">Личное</option>
          </select>

          <fieldset>
            <legend>Приоритет</legend>
            <div>
              <label for="low">Низкий</label>
              <input type="radio" id="low" name="priority" />
            </div>
            <div>
              <label for="middle">Средний</label>
              <input type="radio" id="middle" name="priority" />
            </div>
            <div>
              <label for="high">Высокий</label>
              <input type="radio" id="high" name="priority" />
            </div>
          </fieldset>

          <label for="task_date_input">Срок выполнения</label>
          <input type="date" id="task_date_input" />

          <button type="submit">Добавить задачу</button>
        </form>
      </section>

      <section>
        <h2>Мои задачи</h2>

        <button id="add-task">Добавить задачу</button>

        <ul id="task-list">
          <li>Изучить HTML</li>
          <li>Изучить CSS</li>
          <li>Изучить JavaScript</li>
        </ul>
      </section>
    </main>
  </body>
</html>
